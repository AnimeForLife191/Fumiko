name: Release Fumiko

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSVC Build
          - os: windows-latest
            platform_name: Windows
            archive_name: fumiko-x86_64-pc-windows-msvc.zip
            target_os: windows

          # Linux GNU Build
          - os: ubuntu-latest
            platform_name: Linux
            archive_name: fumiko-x86_64-unknown-linux-gnu.tar.gz
            target_os: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Inject Microsoft Client ID into .env for compile-time bundling
      - name: Create .env with Bundled Microsoft Client ID
        shell: bash
        run: |
          echo "MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}" >> .env

      # 2. Install all required Linux build, webview, and SSL dependencies
      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      # 3. Install Rust
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 4. Build directly with Cargo (CSS & assets are baked inside via include_str! / include_bytes!)
      - name: Build with Cargo
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: cargo build --release --package fumiko

      # 5. Package Windows (.zip containing standalone fumiko.exe)
      - name: Package Windows Release Archive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/release
          7z a "${{ github.workspace }}/${{ matrix.archive_name }}" fumiko.exe

      # 6. Package Linux (.tar.gz containing standalone fumiko binary)
      - name: Package Linux Release Archive
        if: runner.os == 'Linux'
        run: |
          cd target/release
          tar -czvf "${{ github.workspace }}/${{ matrix.archive_name }}" fumiko

      # 7. Upload Artifacts to GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}